<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幸運刮刮卡 - B版 (金幣挑戰賽)</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: #181b29;
      --accent-gold: #ffc107;
      --accent-neon: #ff007f;
      --accent-cyan: #00e5ff;
      --text-main: #f0f3f8;
      --text-sub: #9aa5b8;
      --border-color: #2b3149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #202744 0%, #0c0e17 80%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 40px;
    }

    /* 頂部玩家錢包列 */
    .wallet-bar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(24, 27, 41, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .wallet-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coin-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 193, 7, 0.15);
      border: 1px solid rgba(255, 193, 7, 0.4);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    .coin-badge span.icon {
      font-size: 1.25rem;
    }

    .wallet-actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      background: #252b42;
      border: 1px solid #3d4668;
      color: #bac4db;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-small:hover {
      background: #343c5c;
      color: #fff;
    }

    /* 遊戲設定面板 */
    .settings-panel {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .settings-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-types {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .type-btn {
      background: #20263b;
      border: 1px solid #333d5e;
      color: #cfd8ea;
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .type-btn:hover {
      border-color: var(--accent-cyan);
    }

    .type-btn.active {
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    /* 單刮金額選擇 */
    .cost-selection {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      background: #1e2336;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .cost-selection label {
      font-size: 0.85rem;
      color: var(--text-sub);
      white-space: nowrap;
    }

    .cost-presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .cost-chip {
      background: #2b324d;
      border: 1px solid #414b6f;
      color: #d1d9ec;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .cost-chip.active {
      background: var(--accent-gold);
      color: #111;
      border-color: #ffd54f;
      font-weight: 800;
    }

    .cost-input-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .cost-input-wrapper input {
      width: 54px;
      padding: 4px 6px;
      background: #141724;
      border: 1px solid #414b6f;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      text-align: center;
    }

    .btn-create-card {
      width: 100%;
      background: linear-gradient(135deg, #ff007f, #d6006c);
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 0, 127, 0.4);
      transition: all 0.2s;
      letter-spacing: 1px;
    }

    .btn-create-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(255, 0, 127, 0.6);
    }

    .btn-create-card:active {
      transform: translateY(1px);
    }

    /* 實體風格刮刮卡容器 */
    .card-board {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(180deg, #1b2033 0%, #101322 100%);
      border: 2px solid #333d60;
      border-radius: 18px;
      padding: 16px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    /* 頂部指定號碼看板 */
    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 16px;
    }

    .prize-pool-box {
      flex: 1;
      background: rgba(14, 17, 28, 0.8);
      border: 1px solid #2b3350;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .prize-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .prize-amount {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent-gold);
      text-shadow: 0 0 10px rgba(255, 193, 7, 0.4);
    }

    .prize-formula {
      font-size: 0.7rem;
      color: #72809d;
      margin-top: 2px;
    }

    .target-num-box {
      background: linear-gradient(135deg, #1f2747, #131728);
      border: 2px solid #ff007f;
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      box-shadow: 0 0 16px rgba(255, 0, 127, 0.3);
    }

    .target-num-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #ff77b9;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .target-num-val {
      font-size: 1.9rem;
      font-weight: 900;
      color: #fff;
      font-family: monospace;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff007f;
    }

    /* 當前單刮費用宣告 */
    .card-rule-tag {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141829;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      border: 1px dashed #303754;
    }

    .card-rule-tag span.hl {
      color: var(--accent-cyan);
      font-weight: 700;
    }

    /* 刮刮卡圓格網格容器 */
    .scratch-grid-wrapper {
      width: 100%;
      overflow-x: auto;
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }

    .scratch-grid {
      display: grid;
      gap: 10px;
      margin: 0 auto;
    }

    /* 單個刮卡格 */
    .scratch-cell {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
      cursor: crosshair;
      touch-action: none;
    }

    /* 底層數字層（防作弊 Canvas） */
    .cell-bg-canvas, .cell-cover-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .cell-cover-canvas {
      z-index: 2;
      transition: opacity 0.25s ease-out;
    }

    .scratch-cell.revealed .cell-cover-canvas {
      opacity: 0;
      pointer-events: none;
    }

    /* 條碼裝飾區 */
    .card-footer-barcode {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #2f3755;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .barcode-lines {
      width: 180px;
      height: 24px;
      background: repeating-linear-gradient(
        90deg,
        #505a7d,
        #505a7d 2px,
        transparent 2px,
        transparent 4px,
        #505a7d 4px,
        #505a7d 7px,
        transparent 7px,
        transparent 9px
      );
    }

    .barcode-sn {
      font-family: monospace;
      font-size: 0.7rem;
      color: #667399;
      letter-spacing: 2px;
    }

    /* 中獎彈窗 Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      padding: 16px;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: linear-gradient(135deg, #1b2038, #111422);
      border: 2px solid var(--accent-gold);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-prize-tag {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(90deg, #ff007f, #ff9900);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 12px 0 20px;
    }

    .btn-modal-close {
      background: var(--accent-gold);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 10px 28px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
    }

    /* 餘額不足提示 Toast */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(230, 30, 60, 0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 420px) {
      .scratch-cell {
        width: 44px;
        height: 44px;
      }
      .scratch-grid {
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部玩家金幣錢包 -->
  <div class="wallet-bar">
    <div class="wallet-info">
      <div class="coin-badge">
        <span class="icon">🪙</span>
        <span id="userBalanceDisplay">100</span>
      </div>
      <span style="font-size:0.8rem; color:#8894ab;">遊戲幣</span>
    </div>
    <div class="wallet-actions">
      <button class="btn-small" id="btnQuickBonus">+100 測試補幣</button>
      <button class="btn-small" id="btnResetWallet">重設100</button>
    </div>
  </div>

  <!-- 刮卡設定面板 -->
  <div class="settings-panel">
    <div class="settings-title">
      <span>選擇刮卡規格</span>
      <span style="font-size:0.75rem; color:#6b7897;">5 種等級自由挑戰</span>
    </div>

    <!-- 5種刮卡類型按鈕 -->
    <div class="card-types">
      <button class="type-btn" data-count="10">10 刮</button>
      <button class="type-btn" data-count="20">20 刮</button>
      <button class="type-btn active" data-count="40">40 刮</button>
      <button class="type-btn" data-count="80">80 刮</button>
      <button class="type-btn" data-count="150">150 刮</button>
    </div>

    <!-- 單刮金額選擇 -->
    <div class="cost-selection">
      <label>單刮金額：</label>
      <div class="cost-presets">
        <div class="cost-chip" data-val="1">1 枚</div>
        <div class="cost-chip" data-val="2">2 枚</div>
        <div class="cost-chip active" data-val="5">5 枚</div>
        <div class="cost-chip" data-val="10">10 枚</div>
      </div>
      <div class="cost-input-wrapper">
        <input type="number" id="customCostInput" min="1" max="999" placeholder="自訂" />
        <span style="font-size:0.75rem; color:#8590aa;">枚</span>
      </div>
    </div>

    <button class="btn-create-card" id="btnGenerateCard">✨ 生成並挑戰此卡片</button>
  </div>

  <!-- 刮刮卡主體 -->
  <div class="card-board">
    <div class="card-header-bar">
      <!-- 獎金池展示 -->
      <div class="prize-pool-box">
        <div class="prize-label">🏆 中獎獎金 (總刮數×0.45×單刮)</div>
        <div class="prize-amount" id="displayPrizeAmt">0 🪙</div>
        <div class="prize-formula" id="displayFormulaNote">無條件進位計算</div>
      </div>

      <!-- 指定中獎號碼看板 -->
      <div class="target-num-box">
        <div class="target-num-title">🎯 指定中獎號碼</div>
        <div class="target-num-val" id="targetNumDisplay">---</div>
      </div>
    </div>

    <!-- 單卡消費規則提示 -->
    <div class="card-rule-tag">
      <div>目前規格：<span class="hl" id="curCardTotalText">40 刮</span></div>
      <div>單刮鎖定：<span class="hl" id="curCardCostText">5 枚 / 刮</span> (刮開即扣幣)</div>
    </div>

    <!-- 刮卡網格區 -->
    <div class="scratch-grid-wrapper">
      <div class="scratch-grid" id="scratchGrid"></div>
    </div>

    <!-- 底部條碼 -->
    <div class="card-footer-barcode">
      <div class="barcode-lines"></div>
      <div class="barcode-sn" id="barcodeSN">SN: SCRATCH-8849-B</div>
    </div>
  </div>

  <!-- 中獎彈窗 -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <div style="font-size: 2.8rem; margin-bottom: 6px;">🎉 恭喜中獎！</div>
      <div class="modal-title">命中指定號碼！</div>
      <div class="modal-desc" id="winModalDesc">
        恭喜成功刮出指定中獎號碼！<br>獎金已自動存入您的遊戲錢包。
      </div>
      <div class="modal-prize-tag" id="winModalPrizeText">+0 枚遊戲幣</div>
      <button class="btn-modal-close" id="btnModalClose">太棒了！收下獎金</button>
    </div>
  </div>

  <!-- 提示 Toast -->
  <div class="toast-msg" id="toastMsg">代幣不足！無法刮開此格</div>

  <script>
    /**
     * 幸運刮刮卡 B版 (完整閉包與防作弊封裝)
     */
    (function () {
      'use strict';

      // 禁用開發者偷看熱鍵
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
        ) {
          e.preventDefault();
        }
      });

      // 錢包管理
      const WALLET_KEY = 'scratch_game_wallet_coins_v2';
      let userCoins = parseInt(localStorage.getItem(WALLET_KEY) || '100', 10);
      if (isNaN(userCoins) || userCoins < 0) userCoins = 100;

      // 遊戲設定狀態
      let selectedTotalCount = 40;
      let selectedCostPerScratch = 5;

      // 當前卡片鎖定狀態
      let currentCardActive = false;
      let currentCardTotal = 40;
      let currentCardCost = 5;
      let currentPrize = 0;
      let currentTargetNumber = 0;
      let isCardWon = false;

      // DOM 參照
      const balanceDisplay = document.getElementById('userBalanceDisplay');
      const btnQuickBonus = document.getElementById('btnQuickBonus');
      const btnResetWallet = document.getElementById('btnResetWallet');
      const typeButtons = document.querySelectorAll('.type-btn');
      const costChips = document.querySelectorAll('.cost-chip');
      const customCostInput = document.getElementById('customCostInput');
      const btnGenerateCard = document.getElementById('btnGenerateCard');

      const displayPrizeAmt = document.getElementById('displayPrizeAmt');
      const displayFormulaNote = document.getElementById('displayFormulaNote');
      const targetNumDisplay = document.getElementById('targetNumDisplay');
      const curCardTotalText = document.getElementById('curCardTotalText');
      const curCardCostText = document.getElementById('curCardCostText');
      const scratchGrid = document.getElementById('scratchGrid');
      const barcodeSN = document.getElementById('barcodeSN');

      const winModal = document.getElementById('winModal');
      const winModalDesc = document.getElementById('winModalDesc');
      const winModalPrizeText = document.getElementById('winModalPrizeText');
      const btnModalClose = document.getElementById('btnModalClose');
      const toastMsg = document.getElementById('toastMsg');

      // 音效合成器
      const playBeep = (freq, duration, type = 'sine') => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      };

      const showToast = (text) => {
        toastMsg.textContent = text;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 2200);
      };

      const updateWalletDisplay = () => {
        balanceDisplay.textContent = userCoins;
        localStorage.setItem(WALLET_KEY, userCoins.toString());
      };

      const getPadLen = (maxVal) => maxVal.toString().length < 3 ? 3 : maxVal.toString().length;

      const getGridCols = (count) => {
        switch (count) {
          case 10: return 5;
          case 20: return 5;
          case 40: return 5;
          case 80: return 8;
          case 150: return 10;
          default: return 5;
        }
      };

      typeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          typeButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedTotalCount = parseInt(btn.getAttribute('data-count'), 10);
          updatePreviewCalculation();
        });
      });

      costChips.forEach(chip => {
        chip.addEventListener('click', () => {
          costChips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          customCostInput.value = '';
          selectedCostPerScratch = parseInt(chip.getAttribute('data-val'), 10);
          updatePreviewCalculation();
        });
      });

      customCostInput.addEventListener('input', () => {
        const val = parseInt(customCostInput.value, 10);
        if (!isNaN(val) && val > 0) {
          costChips.forEach(c => c.classList.remove('active'));
          selectedCostPerScratch = val;
          updatePreviewCalculation();
        }
      });

      const updatePreviewCalculation = () => {
        const prize = Math.ceil(selectedTotalCount * 0.45 * selectedCostPerScratch);
        displayPrizeAmt.textContent = `${prize} 🪙`;
        displayFormulaNote.textContent = `${selectedTotalCount} 刮 × 0.45 × ${selectedCostPerScratch} 枚 = ${prize} 枚`;
      };

      // 建立新卡片
      const createNewCard = () => {
        currentCardTotal = selectedTotalCount;
        currentCardCost = selectedCostPerScratch;
        currentPrize = Math.ceil(currentCardTotal * 0.45 * currentCardCost);
        isCardWon = false;

        curCardTotalText.textContent = `${currentCardTotal} 刮`;
        curCardCostText.textContent = `${currentCardCost} 枚 / 刮`;
        displayPrizeAmt.textContent = `${currentPrize} 🪙`;
        displayFormulaNote.textContent = `${currentCardTotal} × 0.45 × ${currentCardCost} = ${currentPrize} 枚`;

        currentTargetNumber = Math.floor(Math.random() * currentCardTotal) + 1;
        const padLen = getPadLen(currentCardTotal);
        targetNumDisplay.textContent = currentTargetNumber.toString().padStart(padLen, '0');

        const randomSN = Math.floor(1000 + Math.random() * 9000);
        barcodeSN.textContent = `SN: SCRATCH-${currentCardTotal}-${randomSN}-B`;

        // 數字隨機洗牌
        let numbers = Array.from({ length: currentCardTotal }, (_, i) => i + 1);
        for (let i = numbers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
        }

        const cols = getGridCols(currentCardTotal);
        scratchGrid.innerHTML = '';
        scratchGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        for (let i = 0; i < currentCardTotal; i++) {
          const numValue = numbers[i];
          const cell = document.createElement('div');
          cell.className = 'scratch-cell';

          const bgCanvas = document.createElement('canvas');
          bgCanvas.className = 'cell-bg-canvas';
          bgCanvas.width = 104;
          bgCanvas.height = 104;

          const coverCanvas = document.createElement('canvas');
          coverCanvas.className = 'cell-cover-canvas';
          coverCanvas.width = 104;
          coverCanvas.height = 104;

          cell.appendChild(bgCanvas);
          cell.appendChild(coverCanvas);
          scratchGrid.appendChild(cell);

          drawNumberCanvas(bgCanvas, numValue, padLen);
          initScratchLayer(cell, coverCanvas, numValue);
        }

        numbers = null;
        currentCardActive = true;
      };

      // 繪製底層數字 Canvas (防 DOM 偷看)
      const drawNumberCanvas = (canvas, num, padLen) => {
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, w / 2 - 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#d6d9e0';
        ctx.lineWidth = 3;
        ctx.stroke();

        const text = num.toString().padStart(padLen, '0');
        ctx.fillStyle = '#1c1f2b';
        ctx.font = 'bold 36px monospace, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, w / 2, h / 2 + 2);
      };

      // 初始化表層刮膜
      const initScratchLayer = (cell, canvas, numValue) => {
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const w = canvas.width;
        const h = canvas.height;

        const grad = ctx.createRadialGradient(w * 0.35, h * 0.35, 6, w / 2, h / 2, w / 2);
        grad.addColorStop(0, '#535b70');
        grad.addColorStop(0.6, '#282d3c');
        grad.addColorStop(1, '#1a1d27');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 3;
        ctx.stroke();

        let isScratching = false;
        let isCharged = false;
        let isRevealed = false;
        let scratchCheckCount = 0;

        const getPos = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
          };
        };

        const tryCharge = () => {
          if (isCharged) return true;

          if (userCoins < currentCardCost) {
            showToast(`⚠️ 遊戲幣不足！需要 ${currentCardCost} 枚，目前僅剩 ${userCoins} 枚`);
            playBeep(220, 0.15, 'triangle');
            return false;
          }

          userCoins -= currentCardCost;
          isCharged = true;
          updateWalletDisplay();
          playBeep(600, 0.06, 'sine');
          return true;
        };

        const scratchAt = (x, y) => {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.arc(x, y, 16, 0, Math.PI * 2);
          ctx.fill();

          scratchCheckCount++;
          if (scratchCheckCount % 5 === 0 && !isRevealed) {
            checkRevealRate();
          }
        };

        const checkRevealRate = () => {
          const imgData = ctx.getImageData(0, 0, w, h);
          const data = imgData.data;
          let transparentPixels = 0;
          const totalSamples = data.length / 4;

          for (let i = 3; i < data.length; i += 16) {
            if (data[i] === 0) transparentPixels++;
          }

          const ratio = transparentPixels / (totalSamples / 4);
          if (ratio > 0.40) {
            revealCompletely();
          }
        };

        const revealCompletely = () => {
          if (isRevealed) return;
          isRevealed = true;
          cell.classList.add('revealed');
          playBeep(880, 0.08, 'sine');

          if (numValue === currentTargetNumber && !isCardWon) {
            triggerWin();
          }
        };

        const triggerWin = () => {
          isCardWon = true;
          userCoins += currentPrize;
          updateWalletDisplay();

          setTimeout(() => playBeep(523.25, 0.15, 'square'), 50);
          setTimeout(() => playBeep(659.25, 0.15, 'square'), 200);
          setTimeout(() => playBeep(783.99, 0.25, 'square'), 350);

          confetti({
            particleCount: 90,
            spread: 70,
            origin: { y: 0.6 }
          });

          const padLen = getPadLen(currentCardTotal);
          winModalDesc.innerHTML = `恭喜成功刮出指定號碼 <strong style="color:#ff007f; font-size:1.3rem;">[ ${numValue.toString().padStart(padLen, '0')} ]</strong>！<br>獲得獎金：<strong>${currentCardTotal} 刮 × 0.45 × ${currentCardCost} 枚</strong>`;
          winModalPrizeText.textContent = `+${currentPrize} 🪙`;
          winModal.classList.add('show');
        };

        const onStart = (e) => {
          if (isRevealed) return;
          if (!tryCharge()) return;
          isScratching = true;
          const pos = getPos(e);
          scratchAt(pos.x, pos.y);
        };

        const onMove = (e) => {
          if (!isScratching || isRevealed) return;
          e.preventDefault();
          const pos = getPos(e);
          scratchAt(pos.x, pos.y);
        };

        const onEnd = () => {
          isScratching = false;
        };

        canvas.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        canvas.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);
      };

      btnQuickBonus.addEventListener('click', () => {
        userCoins += 100;
        updateWalletDisplay();
        showToast('已領取 100 枚測試遊戲幣！');
        playBeep(900, 0.1, 'sine');
      });

      btnResetWallet.addEventListener('click', () => {
        userCoins = 100;
        updateWalletDisplay();
        showToast('錢包已重設為 100 枚！');
      });

      btnGenerateCard.addEventListener('click', () => {
        createNewCard();
        playBeep(500, 0.1, 'triangle');
      });

      btnModalClose.addEventListener('click', () => {
        winModal.classList.remove('show');
      });

      updateWalletDisplay();
      updatePreviewCalculation();
      createNewCard();

    })();
  </script>
</body>
</html>
